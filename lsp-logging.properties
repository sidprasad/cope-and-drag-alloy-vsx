# Logging config for the Alloy language server JVM (java -jar <alloy> lsp).
#
# The Alloy LSP is built on Eclipse lsp4j, which logs an INFO line for every optional JSON-RPC
# notification it doesn't implement — e.g. the editor sends "$/setTrace" and lsp4j prints
# "Unsupported notification method: $/setTrace". That's harmless chatter; raise the level to
# WARNING so it doesn't flood the language-server output. Real warnings/errors still appear.
.level=WARNING
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=WARNING
