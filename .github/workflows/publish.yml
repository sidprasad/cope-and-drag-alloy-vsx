name: Publish

# Publishes to the VS Code Marketplace. Trigger by pushing a version tag that matches
# package.json's "version" (e.g. v0.1.0), or run manually from the Actions tab.
#
# Requires one repository secret:
#   VSCE_PAT  - a Marketplace (Manage) Personal Access Token for the publisher.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      cnd_release:
        description: 'copeanddrag release tag to pull the Sterling (Alloy) dist from'
        required: false
        default: 'v4.0.13'

permissions:
  contents: read

env:
  # The extension does not build Cope and Drag; it ships a prebuilt build:alloy dist pulled from
  # this public release. Bump when you want a newer Cope and Drag (workflow_dispatch can override).
  CND_RELEASE: ${{ github.event.inputs.cnd_release || 'v4.0.13' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # On a tag push, the tag must match package.json's version (you can't republish a version).
      # Skipped for manual runs (workflow_dispatch from a branch), which publish package.json as-is.
      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag version: $tag | package.json version: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match package.json version '$pkg'. Bump \"version\" in package.json (or retag) so they match."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Cope and Drag (Alloy) dist
        run: |
          set -euo pipefail
          url="https://github.com/sidprasad/copeanddrag/releases/download/${CND_RELEASE}/sterling-alloy.zip"
          echo "Downloading $url"
          curl -fsSL -o sterling-forge.zip "$url"
          mkdir -p cnd-dist
          unzip -q sterling-forge.zip -d cnd-dist
          test -f cnd-dist/index.html
          echo "CND_DIST=$PWD/cnd-dist" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # Runs `vscode:prepublish` (compile [typecheck] -> bundle:assets -> bundle:js --production):
      # compiles the Java bridge against a pinned Alloy release (downloaded), copies CND_DIST ->
      # media/, and esbuild-bundles the extension TS -> dist/extension.js.
      # JAVA_HOME is set by setup-java; CND_DIST is set above.
      - name: Package VSIX
        run: npx @vscode/vsce package -o cope-and-drag-alloy.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: cope-and-drag-alloy-vsix
          path: cope-and-drag-alloy.vsix

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath cope-and-drag-alloy.vsix
